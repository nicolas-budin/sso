# Labo SSO : Keycloak + annuaire LDAP (lldap)
# Lancement : docker compose up -d
#   - lldap (UI web)   : http://localhost:17170  (admin / ChangeMe-ldap-2026)
#   - Keycloak (admin) : http://localhost:8080   (admin / admin)
# Le realm "demo" est importé automatiquement depuis keycloak/realm-demo.json
# au premier démarrage (ignoré si le realm existe déjà).
# Pour réimporter après modification du JSON : docker compose down -v && docker compose up -d
# Usage local uniquement : changer tous les secrets avant toute autre utilisation.

services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    ports:
      - "3890:3890"     # LDAP
      - "17170:17170"   # Interface web
    environment:
      TZ: Europe/Zurich
      LLDAP_LDAP_BASE_DN: dc=demo,dc=local
      LLDAP_LDAP_USER_PASS: ChangeMe-ldap-2026
      LLDAP_JWT_SECRET: change-me-jwt-secret-1234567890abcdef
      LLDAP_KEY_SEED: change-me-key-seed-1234567890abcdef
    volumes:
      - lldap_data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Zurich
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
    depends_on:
      - lldap
    restart: unless-stopped

volumes:
  lldap_data:
  keycloak_data:
